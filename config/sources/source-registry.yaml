    politeness_delay_ms: 2500
    fetch_mode: http

    parser_config:
      version: 1
      discover:
        kind: hybrid
        stop_on_first_success: true
        strategies:
          - kind: youthop_api
            base_url: https://www.youthop.com/wp-json/wp/v2/posts
            per_page: 50
            max_pages: 2
      extract:
        detail_fetch: required
        ladder:
          structured: true
          adapter: true
