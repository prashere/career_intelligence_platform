  - id: bigfuture
    name: BigFuture
    url: https://bigfuture.collegeboard.org/scholarship-search
    type: api
    regions: [us]
    tags: [scholarship, financial-aid, college, undergraduate]
    degree_levels: [BSc, Mixed]
    funding_signal: high
    fetch_interval_minutes: 720
    chip_label: BigFuture
    confidence: verified
    adapter_id: bigfuture_collegeboard_v1
    summary_completeness: full
    authority: 0.94
    politeness_delay_ms: 3000
    fetch_mode: http

    parser_config:
      version: 1
      discover:
        kind: hybrid
        stop_on_first_success: true
        strategies:
          - kind: collegeboard_scholarships
            api_url: https://scholarshipsearch-api.collegeboard.org/scholarships
            body:
              pageSize: 50
              pageNumber: 0
              sortBy: DEADLINE_ASC
            url_template: "https://bigfuture.collegeboard.org/scholarships/{slug}"
          - kind: html
            requires_browser: true
            entry_urls:
              - https://bigfuture.collegeboard.org/scholarship-search
            link_selector: "a[href*='/scholarships/']"
            max_entries: 100
      extract:
        detail_fetch: required
        ladder:
          structured: true
          adapter: true
          heuristic: true
        detail:
          title: "h1"
          content: "main"
          remove:
            - "nav"
            - "footer"
            - "script"
            - "style"
      deadline_patterns:
        - '(?i)deadline[:\s]+([^<\n.]+)'
        - '(?i)due[:\s]+([^<\n.]+)'
        - '(?i)apply by[:\s]+([^<\n.]+)'
      canonical:
        strip_query_params: [utm_source, utm_medium, utm_campaign, fbclid]
      filters:
        include_link_regex:
          - '(?i)bigfuture\.collegeboard\.org/scholarships/[^/]+$'
        exclude_link_regex:
          - '(?i)/about/'
          - '(?i)/contact/'
          - '(?i)/careers/'
          - '(?i)/privacy/'
          - '(?i)/terms/'
          - '(?i)/scholarship-search'
          - '(?i)/scholarship-list'
      notes: >
        College Board-operated scholarship and college-planning ecosystem.
        Strong institutional provenance. Primarily relevant to U.S. students
        and U.S. undergraduate funding. Do not generalize its reliability to
        every external link         merely because the discovery platform is reputable.

  - id: scholarpositions
    name: ScholarPositions
    url: https://scholarpositions.com/
    type: wp_json
    regions: [global]
    tags: [scholarship, fully-funded, fellowship, phd, masters, internship]
    degree_levels: [MSc, PhD, Fellowship, Mixed]
    funding_signal: very_high
    fetch_interval_minutes: 360
    chip_label: ScholarPositions
    confidence: verified
    adapter_id: scholarpositions_html_v1
    summary_completeness: full
    authority: 0.76
    politeness_delay_ms: 3000
    fetch_mode: http

    parser_config:
      version: 1
      discover:
        kind: hybrid
        stop_on_first_success: true
        request_timeout_ms: 90000
        cloudflare: true
        strategies:
          - kind: wp_json
            proxy_prefix: https://r.jina.ai/
            base_url: https://scholarpositions.com/wp-json/wp/v2/posts
            per_page: 50
            max_pages: 2
          - kind: html
            requires_browser: true
            entry_urls:
              - https://scholarpositions.com/
            link_selector: "article h2 a, h2.entry-title a, .post-title a"
            max_entries: 100
      extract:
        detail_fetch: required
        ladder:
          structured: true
          adapter: true
          heuristic: true
        detail:
          title: "h1"
          content: "main"
          remove:
            - "nav"
            - "footer"
            - "script"
            - "style"
            - ".comments"
      deadline_patterns:
        - '(?i)deadline[:\s]+([^<\n.]+)'
        - '(?i)application deadline[:\s]+([^<\n.]+)'
        - '(?i)apply before[:\s]+([^<\n.]+)'
        - '(?i)closing date[:\s]+([^<\n.]+)'
      canonical:
        strip_query_params: [utm_source, utm_medium, utm_campaign, fbclid]
      filters:
        require_link_regex:
          - '(?i)scholarpositions\.com/[^/]+/$'
        exclude_link_regex:
          - '(?i)/about/'
          - '(?i)/contact/'
          - '(?i)/advertise/'
          - '(?i)/privacy/'
          - '(?i)/terms/'
          - '(?i)/blog/'
          - '(?i)/category/'
          - '(?i)/tag/'
          - '(?i)/latest-fully-funded-scholarships/'
      notes: >
        Specialist aggregator emphasizing fully-funded scholarships and
        related opportunities. The site publicly claims that listings are
        manually checked for authenticity and updated frequently. Treat this
        as a self-reported verification signal rather than independently
        proven evidence; sample-link verification should remain mandatory.

