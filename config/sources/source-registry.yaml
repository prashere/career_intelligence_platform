        - '(?i)deadline[:\s]+([^<\n.]+)'
        - '(?i)apply by[:\s]+([^<\n.]+)'
        - '(?i)last date[:\s]+([^<\n.]+)'
        - '(?i)applications? close[:\s]+([^<\n.]+)'
      canonical:
        strip_query_params: [utm_source, utm_medium, utm_campaign, utm_content, fbclid]
      filters:
        exclude_link_regex:
          - '(?i)/about/'
          - '(?i)/contact/'
          - '(?i)/advertise/'
          - '(?i)/privacy/'
          - '(?i)/terms/'
