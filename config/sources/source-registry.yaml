            - "style"
            - ".comments"
            - ".related-posts"
      deadline_patterns:
        - '(?i)deadline[:\s]+([^<\n.]+)'
        - '(?i)application deadline[:\s]+([^<\n.]+)'
        - '(?i)applications? due[:\s]+([^<\n.]+)'
        - '(?i)apply by[:\s]+([^<\n.]+)'
      canonical:
        strip_query_params: [utm_source, utm_medium, utm_campaign, utm_content, fbclid]
      filters:
        require_link_regex:
          - '(?i)profellow\.com/fellowship/[a-z0-9-]+/$'
        exclude_link_regex:
          - '(?i)/about/'
          - '(?i)/contact/'
          - '(?i)/membership/'
          - '(?i)/careers/'
          - '(?i)/privacy/'
          - '(?i)/terms/'
          - '(?i)/tips/'
          - '(?i)/interviews/'
          - '(?i)/askdrjohnson/'
          - '(?i)/announcements/'
          - '(?i)/articles/'
          - '(?i)/fellowships/'
      notes: >
        Fellowship database pages live under /fellowship/{slug}/ (singular).
        The sitewide RSS and /fellowships/ paths are editorial listicles,
        tips, interviews and announcements — not ingest targets. Discovery
        uses fellowship-sitemap.xml via the Jina reader because direct HTTP
        is Cloudflare-blocked. Always follow sponsor links for current
        deadlines and eligibility.

# Recommended source-level quality model.
# These fields are intentionally separate from "authority".
# Scores should be populated after empirical auditing of each source.

quality_schema:
  provenance: 0.0
  editorial_curation: 0.0
  official_source_linking: 0.0
  freshness: 0.0
  transparency: 0.0
  user_reputation: 0.0
  noise_control: 0.0
  geographic_relevance: 0.0
  overall: 0.0

verification_defaults:
  official_source_required: true
  deadline_recheck_required: true
  sponsor_recheck_required: true
  stale_after_days: 45

# Important implementation principle:
# "confidence" and "authority" must not be treated as synonyms.
#
# confidence:
#   Whether there is sufficient evidence that the source is a legitimate,
#   functioning discovery source.
#
# authority:
#   Estimated quality/provenance/reliability of the source itself.
#
# Example:
#   CareerOneStop can have very high authority because of its U.S. Department
#   of Labor provenance, while an independent aggregator can still be useful
#   with lower authority.

# Operational validation fields recommended for production:
runtime_validation_schema:
  feed_status: null
  last_successful_fetch: null
  last_failed_fetch: null
  entries_found: 0
  parser_success_rate: null
  duplicate_rate: null
  stale_listing_rate: null
  official_link_rate: null
  deadline_extraction_rate: null
  last_audit_at: null