# Aggregator catalog — schema defaults in ingestion-config.yaml (same directory).

schema_version: "1.2"
default_selection_count: 4

aggregators:
  - id: opportunitydesk
    name: OpportunityDesk
    url: ["https://opportunitydesk.org/feed/"]
    type: rss
    regions: [global]
    tags: [scholarship, fellowship, internship, jobs, conference, exchange, youth-opportunities, grant]
    degree_levels: [BSc, MSc, PhD, Fellowship, Mixed]
    funding_signal: high
    fetch_interval_minutes: 360
    chip_label: Opportunity Desk
    confidence: verified
    adapter_id: opportunitydesk_wordpress_v1
    summary_completeness: snippet_only
    authority: 0.82
    politeness_delay_ms: 2500
    fetch_mode: http

    parser_config:
      version: 1
      discover:
        kind: rss
        feed_urls:
          - "https://opportunitydesk.org/feed/"
        max_entries: 50
        dedupe_by: link
      extract:
        detail_fetch: required
        ladder:
          structured: true
          adapter: true
          heuristic: true
        feed:
          strip_html: true
          use_content_encoded: true
        detail:
          title: "h1.entry-title, h1.post-title, article h1"
          content: "article .entry-content, .post-content, div.entry-content"
          remove:
            - "nav"
            - "footer"
            - "script"
            - ".comments"
            - ".sharedaddy"
            - ".jp-relatedposts"
            - ".related-posts"
      deadline_patterns:
        - '(?i)deadline[:\s]+([^<\n.]+)'
        - '(?i)apply by[:\s]+([^<\n.]+)'
        - '(?i)application deadline[:\s]+([^<\n.]+)'
        - '(?i)applications? close[:\s]+([^<\n.]+)'
      canonical:
        strip_query_params: [utm_source, utm_medium, utm_campaign, utm_content, fbclid]
      filters:
        exclude_link_regex:
          - '(?i)/about/'
          - '(?i)/contact/'
          - '(?i)/advertise/'
          - '(?i)/privacy/'
          - '(?i)/terms/'
      notes: >
        Global youth-opportunity aggregator established in 2012. Covers
        scholarships, fellowships, internships, jobs, exchanges, grants,
        conferences and other development opportunities. Treat the
        aggregator as a discovery layer and preserve the original
        application URL when available.

