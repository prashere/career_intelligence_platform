schema_version: "1.0"
default_selection_count: 4
 
aggregators:
  - id: scholars4dev
    name: Scholars4Dev
    url: https://www.scholars4dev.com/feed/
    type: rss
    regions: [global]
    tags: [scholarship, international, msc, phd, fellowship, developing-countries]
    degree_levels: [MSc, PhD, Fellowship, Mixed]
    funding_signal: high
    fetch_interval_minutes: 360
    chip_label: Scholars4Dev
    confidence: verified
    notes: >
      Long-running (since ~2009), specifically curates for applicants
      from developing countries — good match if the user base skews
      outside the US/UK/EU. No red flags found.
 
  - id: profellow
    name: ProFellow
    url: https://www.profellow.com/feed/
    type: rss
    regions: [global]
    tags: [fellowship, scholarship, graduate, funded-programs]
    degree_levels: [MSc, PhD, Fellowship, Mixed]
    funding_signal: high
    fetch_interval_minutes: 720
    chip_label: ProFellow
    confidence: verified
    notes: >
      Editorially curated rather than scraped — cited repeatedly as a
      go-to fellowship database. Keep.
 
  - id: daad
    name: DAAD
    url: https://www.daad.de/en/rss/rss.xml
    type: rss
    regions: [Germany, Europe]
    tags: [scholarship, germany, msc, phd, international, government]
    degree_levels: [MSc, PhD, Fellowship, Mixed]
    funding_signal: high
    fetch_interval_minutes: 720
    chip_label: DAAD
    confidence: verified
    notes: >
      Official German academic exchange service — as authoritative as
      a funding source gets. Keep.
 
  - id: opportunity_desk
    name: Opportunity Desk
    url: https://opportunitydesk.org/feed/
    type: rss
    regions: [global]
    tags: [scholarship, fellowship, competition, conference, international]
    degree_levels: [MSc, PhD, Fellowship, Mixed]
    funding_signal: medium
    fetch_interval_minutes: 720
    chip_label: Opportunity Desk
    confidence: likely
    notes: >
      Third-party legitimacy checks came back clean, but I saw both an
      opportunitydesk.org and an opportunitydesk.info domain reference —
      worth a quick manual check that .org/feed/ is still the live one
      and not a stale/redirected domain before you trust it long-term.
 
  - id: fundsforngos
    name: fundsforNGOs — Featured Grants
    url: https://www2.fundsforngos.org/category/featured/feed
    type: rss
    regions: [global]
    tags: [fellowship, grants, ngo, individual-grants, research-funding]
    degree_levels: [Fellowship, Mixed]
    funding_signal: high
    fetch_interval_minutes: 720
    chip_label: FundsForNGOs
    confidence: verified
    notes: >
      Registered US entity (FUNDSFORNGOS LLC, Albany NY), operating
      since the 2000s, now with a dedicated "Funds for Individuals" /
      fellowships vertical and even an AI-specific grants category. The
      site's own page embeds this exact feed URL as a live source, so
      confidence is high. Its own marketing notes heavy readership from
      India/Pakistan/Sri Lanka/Nepal — good regional fit if your users
      are South Asia-based. Also worth adding once verified:
      https://fundsforindividuals.fundsforngos.org/feed (fellowships-
      specific subdomain; I could not independently confirm this one).
 
  - id: mladiinfo
    name: Mladiinfo
    url: https://www.mladiinfo.eu/feed/
    type: rss
    regions: [Europe, global]
    tags: [youth, scholarship, fellowship, internship, competition]
    degree_levels: [Mixed, Internship, Fellowship]
    funding_signal: medium
    fetch_interval_minutes: 720
    chip_label: Mladiinfo
    confidence: likely
    notes: >
      Shows up repeatedly alongside Scholars4Dev/Idealist/FundsForNGOs
      on independent "trusted opportunity sites" lists (including a
      university-maintained one), which is a decent quality signal.
      Standard WordPress /feed/ URL guessed from convention — confirm
      it resolves before enabling.
 
# ---------------------------------------------------------------------
# Watch-list: strong, well-established sources for this audience that
# do NOT have one fixed sitewide RSS URL, so I'm not fabricating an
# entry for the schema above. Worth building custom fetchers for later,
# especially given the research/grad-school lean of your target users.
# ---------------------------------------------------------------------
#
# - FindAPhD / FindAMasters (findaphd.com, findamasters.com)
#     World's largest PhD project database (~4,500+ live listings).
#     RSS exists but is generated per saved search/subject filter, not
#     one global feed — you'd construct a feed URL per subject area
#     (e.g. "computer science" + "AI") from a search results page.
#
# - Euraxess (euraxess.ec.europa.eu)
#     The EU's official researcher job/funding/hosting board, 43
#     countries, huge volume. No sitewide RSS found — would need
#     scraping or their (undocumented to me) API.
#
# - WikiCFP (wikicfp.com)
#     Long-running crowd-maintained call-for-papers wiki, strong
#     coverage of AI/ML/CS conferences and workshops — useful for a
#     research-track user. Per-topic query pages exist
#     (wikicfp.com/cfp/call?conference=machine+learning) but I could
#     not confirm a clean per-topic RSS endpoint; treat as needing a
#     scraper, not a feed.
#
# - Idealist (idealist.org)
#     Huge social-impact job/fellowship/grad-school-fair board (200k+
#     orgs, merged with VolunteerMatch in 2025). RSS distribution is
#     confirmed to exist but appears tied to saved searches rather than
#     one global feed.
#
# - Class Central "The Report" (classcentral.com/report)
#     Editorial arm of the largest MOOC aggregator (250k+ courses
#     tracked, 100M+ learners) — good fit if "learning building block"
#     ever needs a course-discovery feed. Likely has a standard
#     /report/feed/ WordPress RSS but I didn't get a raw fetch to
#     confirm.
 