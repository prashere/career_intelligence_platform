name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career
          POSTGRES_DB: career_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: |
          pip install -r requirements.txt
      - name: Enable pgvector extension
        env:
          PGPASSWORD: career
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U career -d career_intelligence -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://career:career@localhost:5432/career_intelligence
          DATABASE_URL_SYNC: postgresql://career:career@localhost:5432/career_intelligence
          APP_ENV: test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: frontend
        run: |
          npm install
          npm run build
